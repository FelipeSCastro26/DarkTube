<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.js"></script>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.4/dist/cdn/material-dynamic-colors.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header class="fill">
        <nav>
            <button class="circle transparent" data-ui="#menu">
                <i>menu</i>
            </button>
            <img class="small" src="/youtube.png">


            <div class="field label suffix border round fill center">
                <input type="text">
                <label>DarkTube</label>
                <i>search</i>
            </div class="Right">
            <button class="circle transparent right-align max">
                <img class="responsive" src="/user.png">
            </button>
        </nav>
    </header>
    
    <div class="grid">
        <div class="s6">
            <div class="video">
                <img class= "img-k" src="slime.avif" alt="">
                <p class="titulo-video"> Abertura de Tensei Shitara Slime</p>
            <div class="caixa-user">
                <img class="circle" src="/user.png">
                <img scr="slime.jpg" class="logo1" alt="">
                <div class="descricao-user">
                    <p class="descricao-nome">Tensura</p>
                    <p class="descricao-inscrito">inscritos 10M</p>
                </div>
                <button class="right-align">Inscreva-se</button>
            </div>
        </div>
    </div>

        <div class="s6">
            <div class="video">
                <img class= "img-k" src="sao.jpg" alt="">
                <p class="titulo-video"> Abertura de Sword Art Online</p>
            <div class="caixa-user">
                <img class="circle" src="/user.png">
                <img scr="slime.jpg" class="logo" alt="">
                <div class="descricao-user">
                    <p class="descricao-nome">Aniplex</p>
                    <p class="descricao-inscrito">inscritos 20M</p>
                </div>
                <button class="botao-insc">Inscrever-se</button>
            </div>
        </div>
    </div>

        <div class="s6">
            <div class="video">
                <img class= "img-k" src="noragami.avif" alt="">
                <p class="titulo-video"> Abertura de Noragami</p>
            <div class="caixa-user">
                <img class="circle" src="/user.png">
                <img scr="slime.jpg" class="logo" alt="">
                <div class="descricao-user">
                    <p class="descricao-nome">Aniplayer</p>
                    <p class="descricao-inscrito">inscritos 1M</p>
                </div>
                <button class="botao-insc">Inscrever-se</button>
                
            </div>
        </div> 
    </div>

        <div class="s6">
            <div class="video">
                <img class= "img-k" src="re_zero.avif" alt="">
                <p class="titulo-video"> Abertura de Re:Zero</p>

            <div class="caixa-user">
                <img class="circle" src="/user.png">
                <img scr="slime.jpg" class="logo" alt="">
                <div class="descricao-user">
                    <p class="descricao-nome">Kadogawa</p>
                    <p class="descricao-inscrito">inscritos 8M</p>
                </div>
                <button class="botao-insc">Inscrever-se</button>
            </div>
        </div>
    </div>
</div>


    <dialog class="left" id="menu">
        <header>
            <nav>
                <img class="circle large" src="/youtube.png">
                <h6 class="max">DarkTube</h6>
                <button class="transparent circle large" data-ui="#menu">
                    <i>close</i>
                </button>
            </nav>
        </header>
        <div class="space"></div>
        <ul class="list">
            <li class="wave round">
                <i class="fa-solid fa-house"></i>
                <span class="max">Início</span>
                <b>24</b>
            </li>
            <li class="wave round">
                <i class="fa-solid fa-bolt"></i>
                <span>Shorts</span>
            </li>
            <li class="wave round">
                <i class="fa-brands fa-rebel"></i>
                <span>Inscrições</span>
            </li>
            <li class="wave round">
                <i class="fa-solid fa-ghost"></i>
                <span>Você</span>
            </li>
            <li class="wave round">
                <i class="fa-brands fa-stack-overflow"></i>
                <span>Histórico</span>
            </li>

        </ul>
    </dialog>
    </header>

</body>

</html>
